[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# PerpExchange is ~34 KB, over EIP-170 (24,576 B). This exchange lives on a local
# chain started with `anvil --code-size-limit 262144`, so the limit is raised here
# too. A mainnet deployment would split the clearing house into facets; that is
# a deployment concern, not a testing one, and is documented in the README.
code_size_limit = 262144

# The deploy script writes the address book the test stacks read.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Deterministic fuzzing: two runs of `forge test` must agree, because the CI
# gate and a developer's machine are compared against each other.
[fuzz]
runs = 256
seed = "0x5155414c495459"

# forge-std is vendored under lib/ (no git submodule), so a fresh clone builds
# without `forge install` or network access.
[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
